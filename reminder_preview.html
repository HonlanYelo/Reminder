<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小闹钟 · 任务提醒</title>
<style>
:root{--blue:#3468f5;--blue2:#4d7dff;--ink:#17213c;--muted:#7d88a8;--line:#e5e9f8;--glass:rgba(255,255,255,.78);--bg:#edf1ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#ffe4ee 0,transparent 32%),radial-gradient(circle at 85% 0,#c9d8ff 0,transparent 40%),linear-gradient(135deg,#b8c8f8,#e9edff 48%,#d6e0ff);display:grid;place-items:center;padding:28px}
.app{width:min(1320px,96vw);min-height:780px;background:rgba(250,251,255,.76);border:1px solid rgba(255,255,255,.85);border-radius:26px;box-shadow:0 30px 80px #425a9a35;backdrop-filter:blur(22px);display:grid;grid-template-columns:225px 1fr;overflow:hidden;position:relative}
.sidebar{background:rgba(236,240,255,.7);border-right:1px solid #dce3ff;padding:28px 16px;display:flex;flex-direction:column}
.brand{text-align:center;padding:12px 8px 30px}.logo{font-size:48px;filter:drop-shadow(0 5px 7px #4776ff40)}.brand h2{margin:4px 0 5px;font-size:23px}.brand p{margin:0;color:var(--muted);font-size:13px}
.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:12px;color:#263454;font-size:15px;text-align:left;cursor:pointer;transition:.18s}.nav button:hover{background:#ffffffa6}.nav button.active{background:#dce6ff;color:var(--blue);font-weight:650;box-shadow:inset 3px 0 var(--blue)}.nav .count{margin-left:auto;background:#e3e8fa;border-radius:50px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px}.nav button.active .count{background:var(--blue);color:white}
.sidebar-bottom{margin-top:auto;background:#ffffff65;border-radius:14px;padding:13px;color:#3b4969;font-size:13px}.green{display:inline-block;width:9px;height:9px;border-radius:50%;background:#25bb76;box-shadow:0 0 0 4px #25bb7620;margin-right:8px}
.main{padding:36px 32px 24px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.greeting h1{font-size:32px;margin:0 0 7px;letter-spacing:-.5px}.greeting p{margin:0;color:#7b85a5;font-size:17px}.actions{display:flex;gap:12px}.search{border:1px solid #dce2f7;background:#ffffff80;border-radius:30px;padding:11px 16px;width:250px;display:flex;gap:9px;align-items:center;color:#7d89aa}.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px;color:var(--ink)}.primary{border:0;border-radius:13px;background:linear-gradient(135deg,#3974ff,#2757e9);color:white;padding:12px 18px;font-weight:600;font-size:15px;box-shadow:0 8px 18px #3468f525;cursor:pointer;transition:.18s}.primary:hover{transform:translateY(-1px);box-shadow:0 12px 22px #3468f530}
.content{display:grid;grid-template-columns:minmax(400px,1fr) 330px;gap:16px}.tasks{display:flex;flex-direction:column;gap:10px}.task{display:grid;grid-template-columns:6px 36px minmax(0,1fr) auto auto 28px;align-items:center;gap:15px;padding:18px 17px;border:1px solid #e1e6f7;background:var(--glass);border-radius:16px;min-height:94px;box-shadow:0 5px 16px #435d9b08;transition:.18s}.task:hover{transform:translateY(-1px);box-shadow:0 10px 24px #435d9b12}.stripe{height:54px;width:4px;background:#3b72ff;border-radius:8px}.check{width:25px;height:25px;border:2px solid #aab4d6;border-radius:7px;background:transparent;cursor:pointer;display:grid;place-items:center;color:white;font-size:15px}.task.done .check{background:#3471ff;border-color:#3471ff}.task.done .check:after{content:"✓"}.task.done .title,.task.done .desc{text-decoration:line-through;color:#929bb5}.info{min-width:0}.title{font-size:17px;font-weight:650;margin-bottom:5px}.desc{font-size:13px;color:#8993b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:#376cff;white-space:nowrap;font-size:14px}.repeat{color:#818ba9;white-space:nowrap;font-size:13px}.more{border:0;background:transparent;color:#818ba9;font-size:20px;cursor:pointer}.empty{padding:45px 15px;text-align:center;color:#8993b0}
.panel{background:rgba(255,255,255,.77);border:1px solid #e3e8f8;border-radius:18px;padding:20px;box-shadow:0 12px 35px #4058910b;height:max-content;position:sticky;top:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;font-size:17px;font-weight:700}.panel-head span:first-child{color:var(--blue);font-size:22px;margin-right:8px}.close{border:0;background:transparent;color:#8892ad;font-size:21px;cursor:pointer}.field{margin-bottom:16px}.field label{display:flex;gap:9px;align-items:center;font-size:13px;color:#455374;margin-bottom:8px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe5f7;background:#fbfcff;border-radius:11px;padding:11px 12px;outline:none;color:#293755;font:inherit;font-size:14px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8eabff;box-shadow:0 0 0 3px #4778ff12}.field textarea{height:72px;resize:vertical}.save{width:100%;margin-top:2px}.footer{margin-top:26px;padding-top:17px;border-top:1px solid #e2e7f7;color:#8893b1;font-size:13px;display:flex;gap:10px;align-items:center}.toast{position:fixed;right:34px;bottom:30px;background:#ffffffdf;backdrop-filter:blur(20px);border:1px solid #e2e7fa;border-radius:18px;padding:17px 20px;box-shadow:0 18px 50px #3b579a35;display:flex;align-items:center;gap:14px;min-width:300px;animation:slide .35s ease}.toast .bell{font-size:30px;background:#e6edff;border-radius:12px;padding:8px}.toast h4{margin:0 0 5px}.toast p{margin:0;font-size:13px;color:#74809f}.toast button{margin-left:auto;border:1px solid #dce3fa;background:#fff;border-radius:22px;padding:7px 12px;cursor:pointer;color:#3c4a6b}@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:1050px){.app{grid-template-columns:190px 1fr}.content{grid-template-columns:1fr}.panel{position:static}.main{padding:25px}.task{grid-template-columns:5px 32px 1fr auto 24px}.repeat{display:none}}
@media(max-width:700px){body{padding:0}.app{width:100vw;min-height:100vh;border-radius:0;grid-template-columns:1fr}.sidebar{display:none}.main{padding:22px 15px}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.search{flex:1;width:auto}.greeting h1{font-size:27px}.task{grid-template-columns:4px 28px 1fr auto;gap:9px;padding:13px}.time{font-size:12px}.more{display:none}.panel{padding:15px}.toast{left:12px;right:12px;bottom:12px;min-width:0}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="logo">⏰</div><h2>小闹钟</h2><p>准时提醒 · 高效生活</p></div>
 <nav class="nav">
  <button class="active" data-filter="all"><span>▦</span> 全部任务 <span class="count" id="allCount">4</span></button>
  <button data-filter="today"><span>▣</span> 今天 <span class="count" id="todayCount">2</span></button>
  <button data-filter="upcoming"><span>◷</span> 即将提醒 <span class="count" id="upcomingCount">1</span></button>
  <button data-filter="done"><span>✓</span> 已完成 <span class="count" id="doneCount">1</span></button>
  <button data-filter="settings"><span>⚙</span> 设置</button>
 </nav>
 <div class="sidebar-bottom"><span class="green"></span>后台运行中<br><small style="padding-left:17px;color:#8994b2">双击打开主界面</small></div>
</aside>
<main class="main">
 <header class="top">
  <div class="greeting"><h1>早上好！</h1><p>今天也要加油哦 ☀️</p></div>
  <div class="actions"><div class="search">⌕ <input id="search" placeholder="搜索任务..."></div><button class="primary" id="newBtn">＋ 新建任务</button></div>
 </header>
 <section class="content">
  <div class="tasks" id="tasks"></div>
  <aside class="panel" id="panel">
   <div class="panel-head"><div><span>＋</span> 新建任务</div><button class="close" id="closePanel">×</button></div>
   <form id="taskForm">
    <div class="field"><input id="taskTitle" placeholder="输入任务内容..." required></div>
    <div class="field"><label>▣　提醒时间</label><input id="taskDate" type="datetime-local" required></div>
    <div class="field"><label>↻　重复</label><select id="repeat"><option>不重复</option><option>每天</option><option>每周</option><option>每月</option><option>工作日</option></select></div>
    <div class="field"><label>▤　备注（可选）</label><textarea id="taskDesc" placeholder="添加一些备注..."></textarea></div>
    <button class="primary save" type="submit">♧ 保存任务</button>
   </form>
  </aside>
 </section>
 <footer class="footer">▥ <span id="footerCount">共 4 个任务 · 1 个已完成</span></footer>
</main>
</div>
<div class="toast" id="toast"><div class="bell">⏰</div><div><h4>任务提醒</h4><b id="toastTitle">学习 Java</b><p>现在是 14:00，开始学习吧！</p></div><button onclick="this.parentElement.remove()">知道了</button><button style="position:absolute;right:7px;top:4px;border:0;background:none;padding:0" onclick="this.parentElement.remove()">×</button></div>
<script>
let tasks=[
{id:1,title:"学习 Java",desc:"复习多线程和锁机制",time:"2025-11-26T14:00",repeat:"每天",done:false},
{id:2,title:"喝水",desc:"多喝水，身体更健康",time:"2025-11-26T10:00",repeat:"每天",done:true},
{id:3,title:"交房租",desc:"下个月的房租别忘了",time:"2025-11-30T09:00",repeat:"每月",done:false},
{id:4,title:"复习 MySQL",desc:"重点：索引和事务",time:"2025-11-26T20:00",repeat:"每天",done:false}
];
let current="all";
const $=s=>document.querySelector(s);
function fmt(iso){let d=new Date(iso);let now=new Date();let same=d.toDateString()===now.toDateString();return (same?"今天 ":"")+`${String(d.getMonth()+1).padStart(2,'0')}月${String(d.getDate()).padStart(2,'0')}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function render(){
 let q=$("#search").value.toLowerCase();
 let list=tasks.filter(t=>(current==="all"||current==="settings"||(current==="done"&&t.done)||(current==="today"&&!t.done&&new Date(t.time).toDateString()===new Date().toDateString())||(current==="upcoming"&&!t.done&&new Date(t.time)>new Date()))&&(`${t.title} ${t.desc}`.toLowerCase().includes(q)));
 $("#tasks").innerHTML=list.length?list.map(t=>`<article class="task ${t.done?'done':''}"><div class="stripe"></div><button class="check" onclick="toggle(${t.id})" aria-label="完成任务"></button><div class="info"><div class="title">${esc(t.title)}</div><div class="desc">${esc(t.desc||"无备注")}</div></div><div class="time">◷　${fmt(t.time)}</div><div class="repeat">↻　${t.repeat}</div><button class="more" onclick="removeTask(${t.id})" title="删除">•••</button></article>`).join(""):`<div class="empty">✨ 暂无任务，享受片刻清闲吧</div>`;
 let done=tasks.filter(t=>t.done).length;
 $("#allCount").textContent=tasks.length;$("#doneCount").textContent=done;$("#todayCount").textContent=tasks.filter(t=>!t.done&&new Date(t.time).toDateString()===new Date().toDateString()).length;$("#upcomingCount").textContent=tasks.filter(t=>!t.done&&new Date(t.time)>new Date()).length;
 $("#footerCount").textContent=`共 ${tasks.length} 个任务 · ${done} 个已完成`;
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toggle(id){let t=tasks.find(t=>t.id===id);t.done=!t.done;render()}
function removeTask(id){if(confirm("删除这个任务？")){tasks=tasks.filter(t=>t.id!==id);render()}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");current=b.dataset.filter;render()});
$("#search").oninput=render;
$("#newBtn").onclick=()=>$("#taskTitle").focus();
$("#closePanel").onclick=()=>$("#panel").style.opacity=$("#panel").style.opacity==="0.35"?"1":".35";
$("#taskForm").onsubmit=e=>{e.preventDefault();tasks.unshift({id:Date.now(),title:$("#taskTitle").value,desc:$("#taskDesc").value,time:$("#taskDate").value,repeat:$("#repeat").value,done:false});e.target.reset();render();$("#taskTitle").focus()};
render();
</script>
</body></html>
